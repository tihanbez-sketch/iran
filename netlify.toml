# Portal deploy routing — THIS BRANCH (claude/pfl-lead-portal-spec-wjsnm1) only.
#
# The Netlify site `pfl-lead-portal` builds this branch. The Next.js app lives
# in portal/, so base points there; portal/netlify.toml carries the same
# settings and governs when Netlify reads config from the base directory.
# The legacy Iran-tracker bundle at the repo root is not built from this
# branch (the config this file replaced contained broken absolute paths and
# could not build anywhere).
#
# WARNING: if this branch is ever merged into a branch that another Netlify
# site builds (e.g. the old tracker site), that site would start building the
# portal. Give each site its own branch — or move the portal to its own repo —
# before any such merge.

[build]
  base = "portal"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
