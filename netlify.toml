functionsDirectory = "/home/user/workspace/iran-tracker/netlify/functions"
functionsDirectoryOrigin = "config"
redirectsOrigin = "config"
plugins = []
headers = []

[build]
publish = "/home/user/workspace/iran-tracker/dist/public"
publishOrigin = "config"
commandOrigin = "ui"
command = "npm run build"
functions = "/home/user/workspace/iran-tracker/netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]